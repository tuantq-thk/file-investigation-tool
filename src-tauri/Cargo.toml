[package]
name = "file-investigation-tool"
version = "0.4.9"
description = "Read-only cross-platform file investigation tool"
authors = ["File Investigation Tool"]
edition = "2021"

[lib]
name = "file_investigation_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
